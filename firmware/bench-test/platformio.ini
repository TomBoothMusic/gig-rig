; The bench test program for the board's controller (a Teensy 4.1).
; GitHub builds it on every change; see docs/bench-test.md.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; The Teensy shows up on the computer as a MIDI device (for the kick pad) and a serial port.
; The second part lets the program use firmware/shared, the one file the app is built from too.
build_flags = -D USB_MIDI_SERIAL -I ${PROJECT_DIR}/../shared
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
